name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만 돈다. 뒤에 밀려온 것이 이기게 두면 오래된 산출물이 나중에 올라간다.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 게이트를 문서와 같은 순서로 돌린다. type:check 는 build 의 tsc -b 가 겸한다.
      - run: pnpm build
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm format:check

      # 이 액션은 기본값으로 Pages 사이트를 조회만 한다. 저장소에 Pages 가 켜져 있지
      # 않으면 빌드와 테스트를 다 지난 뒤 여기서 죽는다. 액션이 직접 켜게 둔다.
      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
