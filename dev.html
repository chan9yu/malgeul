<!doctype html>
<html lang="ko">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<title>vidscript 오디오 추출 검증</title>
		<!-- 검증용 임시 페이지다. 디자인 토큰과 앱 스타일시트를 쓰지 않고 브라우저 기본 스타일에 여백만 준다 -->
		<style>
			body {
				margin: 24px;
				max-width: 640px;
				font-family: monospace;
			}
			dt {
				font-weight: bold;
			}
			dd {
				margin: 0 0 8px 0;
			}
			audio {
				width: 100%;
			}
		</style>
	</head>
	<body>
		<h1>오디오 추출 검증</h1>
		<p>mp4나 mov 파일을 고르고 추출을 실행한다. 결과는 16kHz 모노 PCM이다.</p>

		<p>
			<input type="file" id="video-file" accept=".mp4,.mov,video/mp4,video/quicktime" />
			<button type="button" id="extract-button" disabled>추출 실행</button>
		</p>

		<p id="status-text">파일을 고르세요</p>

		<dl id="result-list"></dl>

		<h2>추출한 음성</h2>
		<audio id="pcm-player" controls></audio>

		<script type="module" src="/src/dev/main.ts"></script>
	</body>
</html>
